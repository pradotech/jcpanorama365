    <title>JC Panorama 365 — Informação que conecta. Todos os dias.</title>
    <script>
      // Identificador de versão do build atual da aplicação
      window.__APP_VERSION__ = "1795562139513";
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // 1. Recarregar automaticamente se um chunk dinâmico do Vite falhar após novo deploy
      window.addEventListener('vite:preloadError', function(event) {
        event.preventDefault();
        window.location.reload();
      });

      // 2. Verificação ativa de nova versão implantada no servidor (independente de Service Worker)
      (function() {
        var isReloading = false;

        function checkAppVersion() {
          if (isReloading || window.location.pathname.startsWith('/admin')) return;
          fetch('/version.json?_t=' + Date.now(), { cache: 'no-store' })
            .then(function(res) { return res.ok ? res.json() : null; })
            .then(function(data) {
              if (data && data.version && window.__APP_VERSION__ && data.version !== window.__APP_VERSION__) {
                isReloading = true;
                window.location.reload();
              }
            })
            .catch(function() {});
        }

        // Verifica a cada 60 segundos se o app estiver visível
        setInterval(function() {
          if (document.visibilityState === 'visible') {
            checkAppVersion();
          }
        }, 60 * 1000);

        // Verifica imediatamente ao retornar para o app/aba no celular
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') {
            checkAppVersion();
          }
        });
      })();

      // 3. Registro e ciclo de vida do Service Worker (PWA)
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        var isRefreshing = false;

        // Quando o novo Service Worker ativa, recarrega a página silenciosamente com a versão nova
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!isRefreshing) {
            if (window.location.pathname.startsWith('/admin')) {
              return;
            }
            isRefreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(function(registration) {
            // Força checagem de nova versão imediatamente ao carregar
            registration.update().catch(function() {});

            // Ativa o novo Service Worker imediatamente ao detectá-lo
            registration.addEventListener('updatefound', function() {
              var newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              }
            });

            // Checa atualização sempre que o usuário voltar para o navegador/app no celular
            document.addEventListener('visibilitychange', function() {
              if (document.visibilityState === 'visible') {
                registration.update().catch(function() {});
              }
            });

            // Checa atualização periodicamente a cada 2 minutos
            setInterval(function() {
              registration.update().catch(function() {});
            }, 2 * 60 * 1000);
          }).catch(function() {});
        });
      }
    </script>
